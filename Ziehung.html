<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ziehung">
<title>Ziehung</title>
<style>
:root{--bg:#f2f1ec;--fg:#1d2423;--muted:#5d6a68;--card:#fbfaf7;--line:#cfd3cd;--accent:#1f5c5a;--onaccent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121818;--fg:#e9eeec;--muted:#9bacaa;--card:#1a2322;--line:#2e3d3b;--accent:#7cc4bf;--onaccent:#0c1514}}
:root[data-theme="dark"]{--bg:#121818;--fg:#e9eeec;--muted:#9bacaa;--card:#1a2322;--line:#2e3d3b;--accent:#7cc4bf;--onaccent:#0c1514}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 20px 28px}
main{width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;gap:18px}
#result{flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;font:600 clamp(28px,8vw,40px)/1.2 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
#result.idle{color:var(--muted);font-weight:400;font-size:20px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;border:0;border-radius:16px;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#draw{background:var(--accent);color:var(--onaccent);font-size:22px;font-weight:600;padding:20px}
#toggle{background:transparent;color:var(--muted);padding:10px;text-decoration:underline}
#editor{display:none;flex-direction:column;gap:10px}
#editor.open{display:flex}
textarea{width:100%;min-height:300px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical}
#save{background:var(--fg);color:var(--bg);padding:14px;font-weight:600}
#count,#msg{color:var(--muted);font-size:15px;margin:0}
</style>
</head>
<body>
<main>
  <div id="result" class="idle" role="status" aria-live="polite">Tippe auf „Ziehen“</div>
  <button id="draw" type="button">Ziehen</button>
  <section id="editor" aria-label="Varianten bearbeiten">
    <label for="list">Deine Varianten, eine pro Zeile</label>
    <textarea id="list" spellcheck="false"></textarea>
    <p id="count"></p>
    <button id="save" type="button">Liste speichern</button>
    <p id="msg"></p>
  </section>
  <button id="toggle" type="button">Liste bearbeiten</button>
</main>
<script>
(function(){
  var KEY="ziehung-liste";
  var defaults=[];for(var i=1;i<=15;i++)defaults.push("Variante "+i);
  var items=defaults.slice();
  var saved=false;
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p)&&p.length){items=p;saved=true;}}}catch(e){}
  var $=function(id){return document.getElementById(id)};
  var result=$("result"),list=$("list"),editor=$("editor"),count=$("count"),msg=$("msg"),busy=false;
  function parse(){return list.value.split("\n").map(function(t){return t.trim()}).filter(Boolean)}
  function updateCount(){var n=parse().length;count.textContent=n+(n===1?" Variante":" Varianten")}
  function pick(){return items[Math.floor(Math.random()*items.length)]}
  function show(t,idle){result.textContent=t;result.className=idle?"idle":""}
  list.value=items.join("\n");updateCount();
  if(!saved){editor.classList.add("open");$("toggle").textContent="Liste ausblenden";}
  list.addEventListener("input",updateCount);
  $("toggle").addEventListener("click",function(){
    var open=editor.classList.toggle("open");
    this.textContent=open?"Liste ausblenden":"Liste bearbeiten";
  });
  $("save").addEventListener("click",function(){
    var n=parse();
    if(!n.length){msg.textContent="Die Liste ist leer. Trage mindestens eine Variante ein.";return}
    items=n;msg.textContent="Gespeichert.";
    try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){msg.textContent="Gespeichert, aber nur bis zum Schließen der Seite."}
    show("Tippe auf „Ziehen“",true);
  });
  $("draw").addEventListener("click",function(){
    if(busy)return;
    var final=pick();
    var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(calm||items.length<2){show(final);return}
    busy=true;var steps=10,k=0;
    (function tick(){
      if(k<steps){show(pick());k++;setTimeout(tick,50+k*14)}
      else{show(final);busy=false}
    })();
  });
})();
</script>
</body>
</html>
